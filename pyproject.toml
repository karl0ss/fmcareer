[project]
name = "fmcareer"
dynamic = ["version"]
description = "A manager's career history report from a Football Manager 26 save"
readme = "README.md"
requires-python = ">=3.12"
# fmsave is our fork (branch history-decoders), pinned to a commit so every build reads saves the
# same way; move the pin forward deliberately when the fork changes.
dependencies = [
    "fmsave @ git+https://github.com/karl0ss/fmsave.git@21da17bb8e80b29fa3f0e7668660a710e3a7196a",
    "backports.zstd>=1.0; python_version < '3.14'",  # reading the game's database files (gamedb)
]

[project.optional-dependencies]
images = ["UnityPy>=1.20"]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]
build = ["pyinstaller>=6.10"]

[project.scripts]
fmcareer = "fmcareer.report:main"
fmcareer-names = "fmcareer.names:main"
fmcareer-app = "fmcareer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "fmcareer/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*-session-*.md"]  # saved Claude session transcripts: their code is a record, not ours to format

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "C408",    # dict(key=value) is the house style for records
    "E501",    # long lines: the formatter wraps what it can; long string literals stay whole
    "RUF001",  # typographic characters are deliberate in user-facing text (–, ·, “ ”)
    "RUF002",
    "RUF003",
]

[tool.pyright]
include = ["fmcareer"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
