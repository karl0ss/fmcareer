[project]
name = "fmcareer"
dynamic = ["version"]
description = "A manager's career history report from a Football Manager 26 save"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fmsave @ git+https://github.com/karl0ss/fmsave.git@history-decoders"]

[project.optional-dependencies]
images = ["UnityPy>=1.20"]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
fmcareer = "fmcareer.report:main"
fmcareer-names = "fmcareer.names:main"
fmcareer-app = "fmcareer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "fmcareer/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
