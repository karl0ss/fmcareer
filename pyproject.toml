[project]
name = "fmcareer"
version = "0.1.0"
description = "A manager's career history report from a Football Manager 26 save"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fmsave @ git+https://github.com/karl0ss/fmsave.git@history-decoders"]

[project.optional-dependencies]
images = ["UnityPy>=1.20"]

[project.scripts]
fmcareer = "fmcareer.report:main"
fmcareer-names = "fmcareer.names:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
