name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[images,dev]"
      - run: ruff check . && ruff format --check .
      - run: for f in fmcareer/web/*.js; do node --check "$f"; done   # the report's and the app's scripts
      - run: python -m pytest -q   # browser page checks skip where there is no headless Chromium
