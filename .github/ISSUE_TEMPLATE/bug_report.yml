name: Bug report
description: Something went wrong reading a save or building a report
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The log is the most useful thing you can send: it shows
        exactly where the app stopped.

        **To get it:** in the app, click **Download the log** (next to the error, or at the
        bottom of the page). That saves `fmcareer-log.txt`. Drag it into the box below.
        Your home folder is hidden in it and any AI token is never written to it.
  - type: input
    id: version
    attributes:
      label: fmcareer version
      description: Shown at the top of the app, e.g. v0.0.9.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The error the app showed, and which step you were on (Load managers, Generate report, Read names…).
      placeholder: "I clicked Generate report and got: KeyError: 126108"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The log (fmcareer-log.txt)
      description: Drag and drop the downloaded log file here so it uploads with the issue.
    validations:
      required: true
  - type: input
    id: save
    attributes:
      label: Your save file (if you're happy to share it)
      description: |
        The log says where reading stopped; the save itself is what lets us fix it. It's the one
        `.fm` file in Documents\Sports Interactive\Football Manager 26\games. Saves are hundreds of
        MB, too big to attach here, so upload it to Google Drive, Dropbox, OneDrive or WeTransfer and
        paste the link. It is only used to work out the fix.
      placeholder: https://drive.google.com/...
  - type: textarea
    id: career
    attributes:
      label: About your career
      description: Anything unusual helps, e.g. currently unemployed, managing a national team, a save carried over from an older version, lots of seasons.
